name: Weekly Instagram Analysis



on:

  schedule:
  
    # 毎週土曜 9:00 JST (0:00 UTC)
    
    - cron: '0 0 * * 6'
    
  workflow_dispatch:
  


permissions:

  contents: read
  


jobs:

  analyze:
  
    runs-on: ubuntu-latest
    
    timeout-minutes: 15
    
    steps:
    
      - name: Checkout code
      
        uses: actions/checkout@v4
        


      - name: Set up Python
      
        uses: actions/setup-python@v5
        
        with:
        
          python-version: '3.11'
          


      - name: Install dependencies
      
        run: python -m pip install --upgrade requests python-dotenv
        


      - name: Run Manus Analysis Task
      
        env:
        
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          
        run: python scripts/request_analysis.py
        





















